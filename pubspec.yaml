name: monthly_money
description: 배당나무 - 한국 배당주 포트폴리오 앱 (실시간 API 연동 v2)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # HTTP / API
  http: ^1.2.1
  dio: ^5.4.3+1
  xml: ^6.5.0
  archive: ^3.6.1                  # OpenDART corpCode.xml 압축 해제용
  charset_converter: ^2.1.1        # KRX EUC-KR 디코딩

  # 로컬 저장소
  shared_preferences: ^2.2.3       # KIS access_token 저장
  hive: ^2.2.3                     # 종목/시세 캐시
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2   # API 키 안전 보관

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # 유틸
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
